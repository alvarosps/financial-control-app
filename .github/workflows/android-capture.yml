name: Android capture
on:
  pull_request:
    paths: &capture-paths
      - 'apps/android-capture/**'
      - 'apps/web/src/app/api/capture/**'
      - 'packages/api/src/lib/capture-*'
      - 'packages/api/src/services/capture-*'
      - 'packages/api/src/services/financial-event.service*'
      - 'packages/api/src/lib/purchase-input.ts'
      - 'packages/shared/src/financial-events.ts'
      - '.github/workflows/android-capture.yml'
  push:
    branches: [main]
    paths: *capture-paths
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/android-capture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper and install pinned SDK
        run: |
          echo 'b3a875ddc1f044746e1b1a55f645584505f4a10438c1afea9f15e92a7c42ec13  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.1.0'
      - name: JVM, lint and APK
        run: bash gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free unused NDK space for the emulator
        run: |
          for ndk_dir in "${ANDROID_HOME}"/ndk/*; do
            if [ -d "$ndk_dir" ]; then
              "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --uninstall "ndk;${ndk_dir##*/}"
            fi
          done
          df -h "$HOME"
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          working-directory: apps/android-capture
          script: bash gradlew connectedDebugAndroidTest --console=plain
