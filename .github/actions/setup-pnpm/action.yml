name: Setup Node and pnpm
description: Install pnpm dependencies with the repository Node version and pnpm cache.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Verify toolchain
      shell: bash
      run: |
        node --version
        pnpm --version
        node -e "if (process.versions.node !== '24.14.1') throw new Error('Expected Node.js 24.14.1')"
        test "$(pnpm --version)" = "10.33.0"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
